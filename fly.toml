# Fly.io configuration for a public demo (see docs/deploy.md).
#   fly launch --no-deploy --copy-config --name <your-app-name>
#   fly secrets set APP_USER_AGENT="AI-Street-Situation (https://your-site.example)"
#   fly deploy
app = "ai-street-situation"
primary_region = "fra"

[build]
  # The image published by .github/workflows/docker-publish.yml. Remove this
  # line to build from the Dockerfile instead.
  image = "ghcr.io/yossi123654/ai-street-situation:latest"

[env]
  TRUST_PROXY = "true"
  SITE_NOTICE = "demo"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
